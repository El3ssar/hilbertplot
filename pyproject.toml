[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hilbertplot"
version = "0.1.0"
description = "The complete set of 40 two-dimensional Hilbert curves, and data plots on them."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639: a license expression plus the file, instead of the deprecated
# `license = { text = ... }` + `License ::` classifier pair.
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel Estevez", email = "kemossabee@gmail.com" }]
keywords = [
    "hilbert-curve",
    "space-filling-curve",
    "moore-curve",
    "locality",
    "dimensionality-reduction",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
# dev composes [plot] rather than restating matplotlib, so the two cannot drift.
dev = ["hilbertplot[plot]", "pytest>=7.0", "ruff==0.15.13"]

[project.urls]
Homepage = "https://github.com/El3ssar/hilbertplot"
Source = "https://github.com/El3ssar/hilbertplot"
Issues = "https://github.com/El3ssar/hilbertplot/issues"
Changelog = "https://github.com/El3ssar/hilbertplot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/hilbertplot"]

# Ship only the package, tests, examples and metadata in the sdist -- never the
# copyrighted source PDFs, scratch files or internal research notes at the repo root.
[tool.hatch.build.targets.sdist]
include = [
    "/src/hilbertplot",
    "/tests",
    "/examples/*.py",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-W error::RuntimeWarning` turns any numpy RuntimeWarning raised during the suite into a
# failure: an "invalid value encountered in divide" during ordinary use is a defect, not
# noise.  (The README's own snippets are executed by tests/test_readme.py.)
addopts = "-W error::RuntimeWarning"

[tool.ruff]
line-length = 100
# extend-exclude ADDS to Ruff's defaults (.git, __pycache__, build/, dist/, ...);
# do not use `exclude` here or those built-in ignores would be lost.
extend-exclude = ["research/"]

[tool.ruff.lint]
# RUF/SIM/C4/RET/PERF/NPY/PT are all near-zero-noise on this codebase and catch the
# classes of drift that actually bit us: unsorted __all__, stale noqa, over-broad
# pytest.raises, and numpy-specific footguns.  ANN/D are deliberately NOT enabled --
# they would flag 390 sites without improving anything.
select = ["E", "F", "I", "UP", "B", "W", "RUF", "SIM", "C4", "RET", "PERF", "NPY", "PT"]

[tool.ruff.lint.per-file-ignores]
# examples use en dashes in figure titles on purpose (RUF001 ambiguous-unicode)
"examples/*.py" = ["RUF001"]

[tool.semantic_release]
# pyproject keeps a STATIC version = "0.1.0"; PSR stamps BOTH files in sync on
# every release so the two never drift.
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/hilbertplot/__init__.py:__version__"]
tag_format = "v{version}"
# Stay on 0.x: without this, PSR (v10 default = false) forces the first release
# to 1.0.0. With it, a feat on 0.0.0 -> 0.1.0, and breaking changes still cut 1.0.0.
allow_zero_version = true
major_on_zero = true
commit_parser = "conventional"
# uv-based build (produces sdist + wheel). In CI this runs only for local
# `semantic-release version` invocations; the GitHub Action sets build:false and
# the publish job rebuilds from the tag, because the action's container has no uv.
build_command = "uv build"

[tool.semantic_release.branches.main]
match = "(main|master)"
prerelease = false
prerelease_token = "rc"

[tool.semantic_release.changelog]
mode = "update"                          # insert at the marker (v10 default)
insertion_flag = "<!-- version list -->" # MUST exist in CHANGELOG.md for update mode

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = true
