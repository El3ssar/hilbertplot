version: 2
updates:
  # Keep the GitHub Actions used by the CI / release workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      # Non-release type so Dependabot bumps never cut a version by themselves.
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"

  # Keep the Python runtime + dev dependencies (pyproject.toml) current.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # Don't let Dependabot bump ruff at all. Its releases add/tighten lint & format
      # rules that can turn CI red (0.16 even reformats the README code blocks), so
      # ruff is pinned exact and upgraded deliberately in its own PR.
      - dependency-name: "ruff"
